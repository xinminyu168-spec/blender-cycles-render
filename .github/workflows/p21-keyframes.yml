name: P21.7 Cycles three keyframes
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/p21-keyframes.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  keyframes:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack model
        run: |
          mkdir -p project logs
          cat payload.part00 payload.part01 payload.part02 > render_payload.zip
          sha256sum -c payload.sha256
          unzip -q render_payload.zip -d project
          test -f project/21_build_render.py
          python patches/fix_blender5_glare.py project/21_build_render.py
      - name: Install Blender
        run: |
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o blender-5.0.1-linux-x64.tar.xz
          curl -fL --retry 3 https://download.blender.org/release/Blender5.0/blender-5.0.1.sha256 -o checksums
          grep -F blender-5.0.1-linux-x64.tar.xz checksums > blender.sha256
          sha256sum -c blender.sha256
          tar -xf blender-5.0.1-linux-x64.tar.xz
          echo "$RUNNER_TEMP/blender-5.0.1-linux-x64" >> "$GITHUB_PATH"
      - name: Render frames 0, 150, 300 with Cycles
        shell: bash
        run: |
          set -euo pipefail
          blender --version | tee logs/blender-version.txt
          blender -b --python-exit-code 1 --python project/21_build_render.py -- --quality draft --render test 2>&1 | tee logs/cycles.log
          python -c "import json,pathlib; p=pathlib.Path('project/renders/draft'); q=json.loads((p/'runtime_qa.json').read_text()); assert q['complete'] and q['engine']=='CYCLES'; assert [x['frame'] for x in q['rendered_frames']]==[0,150,300]; assert all((p/x['file']).stat().st_size>24 for x in q['rendered_frames']); print(q)"
      - name: Save test image and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P21-keyframes
          path: |
            logs/
            project/renders/
          if-no-files-found: warn
          retention-days: 7
