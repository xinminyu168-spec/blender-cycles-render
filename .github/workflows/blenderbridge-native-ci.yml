name: BlenderBridge native CI
on:
  push:
    branches: [blenderbridge-native-ci]
    paths:
      - 'blenderbridge-ci/**'
      - '.github/workflows/blenderbridge-native-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'blenderbridge-ci/**'
      - '.github/workflows/blenderbridge-native-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout pinned upstream
        uses: actions/checkout@v4
        with:
          repository: zephyr7030/DroidBridge
          ref: e070a70fa810bfbd7cf8eeba211aafe706844a53
          path: upstream
          persist-credentials: false
      - name: Apply fixed-action patch
        run: |
          python3 blenderbridge-ci/integrate.py upstream
          git -C upstream diff --check
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustup target add aarch64-linux-android x86_64-linux-android
      - name: Generate and check contract
        working-directory: upstream/rust
        run: |
          cargo run --locked -p contract --bin generate-contract
          cargo run --locked -p contract --bin generate-contract -- --check
          cargo check --locked --workspace
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Android SDK and NDK
        run: |
          command -v sdkmanager
          sdkmanager --version
          sdkmanager --list --channel=3 > "$RUNNER_TEMP/android-sdk-packages.txt"
          grep -E "platforms;android-(3[6-9]|[A-Za-z])|ndk;29|build-tools;36" "$RUNNER_TEMP/android-sdk-packages.txt" || true
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0" "ndk;29.0.14206865"
          test -f "$ANDROID_HOME/platforms/android-37.0/android.jar"
          ls -ld "$ANDROID_HOME"/platforms/android-37*
          cargo install cargo-ndk --locked
      - name: Resolve Kotlin plugins from published Maven modules
        working-directory: upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("settings.gradle.kts")
          old=p.read_text()
          anchor="pluginManagement {\n"
          assert old.count(anchor)==1
          p.write_text(old.replace(anchor, anchor+'''    resolutionStrategy {
                  eachPlugin {
                      when (requested.id.id) {
                          "org.jetbrains.kotlin.plugin.compose" -> useModule("org.jetbrains.kotlin:compose-compiler-gradle-plugin:${requested.version}")
                          "org.jetbrains.kotlin.plugin.serialization" -> useModule("org.jetbrains.kotlin:kotlin-serialization:${requested.version}")
                      }
                  }
              }
          ''',1))
          lock=Path("buildscript-gradle.lockfile")
          lines=lock.read_text().splitlines()
          stale={
              "org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:2.4.10=classpath",
              "org.jetbrains.kotlin.plugin.serialization:org.jetbrains.kotlin.plugin.serialization.gradle.plugin:2.4.10=classpath",
          }
          assert all(lines.count(entry)==1 for entry in stale), "Unexpected dependency lock state"
          assert "org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.4.10=classpath" in lines
          assert "org.jetbrains.kotlin:kotlin-serialization:2.4.10=classpath" in lines
          lock.write_text("\n".join(line for line in lines if line not in stale)+"\n")
          print("Removed only two obsolete plugin marker lock entries")
          PY
          for artifact in compose-compiler-gradle-plugin kotlin-serialization; do
            url="https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/$artifact/2.4.10/$artifact-2.4.10.pom"
            curl --location --retry 2 --connect-timeout 15 --max-time 60 --silent --show-error --output /dev/null --write-out "$artifact HTTP %{http_code}\n" "$url" || true
          done
      - name: Add narrowly scoped Maven metadata verification
        working-directory: upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          import hashlib
          import re
          import xml.etree.ElementTree as ET
          p = Path("gradle/verification-metadata.xml")
          ns = "https://schema.gradle.org/dependency-verification"
          tree = ET.parse(p)
          components = tree.getroot().find("{"+ns+"}components")
          text = p.read_text()
          for group, name, version, filename in [
              ("com.google.guava", "guava-parent", "33.4.0-jre", "guava-parent-33.4.0-jre.pom"),
              ("org.junit", "junit-bom", "5.10.2", "junit-bom-5.10.2.module"),
              ("org.junit", "junit-bom", "5.11.0-M2", "junit-bom-5.11.0-M2.module"),
          ]:
              url = "https://repo.maven.apache.org/maven2/"+group.replace(".","/")+"/"+name+"/"+version+"/"+filename
              with urlopen(url, timeout=30) as r:
                  data = r.read(1048577)
              assert len(data) <= 1048576
              digest = hashlib.sha256(data).hexdigest()
              pinned = {
                  "guava-parent-33.4.0-jre.pom": "3a499ed34a0d9ee0f1bcc39230021a1cd4e2f7dd0426ab6844f585465d41dcd7",
                  "junit-bom-5.10.2.module": "de23b114b3e4119a8fe6eb17bed5a3852816698bace67071579d6d927ebb080a",
                  "junit-bom-5.11.0-M2.module": "86477abcf490d6ca059aa9973cb108d22a506f49d1a5569bb32cc6cbf43c2cce",
              }
              assert digest == pinned[filename], "Previously observed metadata digest changed"
              # Older Maven metadata may not publish a SHA-256 sidecar.
              # Only the three named metadata files use this bootstrap path.
              # Never accept a checksum mismatch or modify an existing pin.
              from urllib.error import HTTPError
              verified_by = None
              for algorithm, length in [("sha256", 64), ("sha512", 128), ("sha1", 40)]:
                  try:
                      with urlopen(url+"."+algorithm, timeout=30) as r:
                          expected = r.read(1024).decode("ascii").strip().split()[0].lower()
                  except HTTPError as e:
                      if e.code != 404:
                          raise
                      print("Missing sidecar:", filename, algorithm)
                      continue
                  assert re.fullmatch("[0-9a-f]{"+str(length)+"}",expected), filename
                  assert hashlib.new(algorithm,data).hexdigest()==expected, "Checksum mismatch: "+filename
                  verified_by = algorithm
                  break
              assert verified_by is not None, "No publisher checksum for "+filename
              print("Bootstrap metadata:",filename,"sidecar:",verified_by,"sha256:",digest)
              attrs = {"group":group,"name":name,"version":version}
              matches = [c for c in components if c.attrib == attrs]
              assert len(matches)<=1
              existing = [] if not matches else [a for a in matches[0] if a.attrib.get("name")==filename]
              if existing:
                  assert len(existing)==1
                  assert digest in [h.attrib.get("value") for h in existing[0] if h.tag=="{"+ns+"}sha256"], "Existing pin mismatch: "+filename
                  continue
              block = '         <artifact name="'+filename+'">\n            <sha256 value="'+digest+'" origin="Maven Central metadata bootstrap"/>\n         </artifact>\n'
              tag = '      <component group="'+group+'" name="'+name+'" version="'+version+'">\n'
              if matches:
                  assert text.count(tag)==1
                  text=text.replace(tag,tag+block,1)
              else:
                  assert text.count("   </components>")==1
                  text=text.replace("   </components>",tag+block+"      </component>\n   </components>",1)
              print("Added metadata pin:",filename,digest)
          ET.fromstring(text)
          p.write_text(text)
          PY
      - name: Verify and pin Linux AAPT2 from Google Maven
        working-directory: upstream
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import urlopen
          from urllib.error import HTTPError
          import hashlib
          import re
          import xml.etree.ElementTree as ET
          path=Path("gradle/verification-metadata.xml")
          version="9.4.0-15978811"
          filename="aapt2-"+version+"-linux.jar"
          url="https://dl.google.com/dl/android/maven2/com/android/tools/build/aapt2/"+version+"/"+filename
          with urlopen(url, timeout=120) as r:
              data=r.read(67108865)
          assert len(data)<=67108864 and data[:4]==b"PK\x03\x04"
          digest=hashlib.sha256(data).hexdigest()
          verified=False
          for algorithm,n in [("sha256",64),("sha512",128)]:
              try:
                  with urlopen(url+"."+algorithm,timeout=30) as r:
                      expected=r.read(1024).decode("ascii").strip().split()[0].lower()
              except HTTPError as e:
                  if e.code!=404: raise
                  print("Missing Google checksum:",algorithm)
                  continue
              assert re.fullmatch("[0-9a-f]{"+str(n)+"}",expected)
              assert hashlib.new(algorithm,data).hexdigest()==expected,"AAPT2 checksum mismatch"
              verified=True
              break
          print("AAPT2 Linux SHA-256:",digest)
          assert verified,"Strong publisher checksum unavailable; manual review required"
          text=path.read_text()
          anchor='      <component group="com.android.tools.build" name="aapt2" version="'+version+'">\n'
          assert text.count(anchor)==1
          assert 'name="'+filename+'"' not in text
          block='         <artifact name="'+filename+'">\n            <sha256 value="'+digest+'" origin="Google Maven bootstrap"/>\n         </artifact>\n'
          text=text.replace(anchor,anchor+block,1)
          ET.fromstring(text)
          path.write_text(text)
          PY
      - name: Build debug APK (separate package)
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew :standalone:assembleDebug --no-daemon --stacktrace --info --refresh-dependencies
      - name: Verify APK identity and signature
        working-directory: upstream
        run: |
          shopt -s nullglob
          apks=(standalone/build/outputs/apk/debug/*.apk)
          test "${#apks[@]}" -gt 0
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep "^package: name='com.droidbridge.standalone.debug'"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$apk"
            sha256sum "$apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: blenderbridge-native-debug-apk
          path: upstream/standalone/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
