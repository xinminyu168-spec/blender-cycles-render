name: P23.3 complete native 4K frame
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p23-complete.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: p23-complete-frame150
  cancel-in-progress: false
jobs:
  tile:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - x: 0
            y: 0
          - x: 1
            y: 0
          - x: 2
            y: 0
          - x: 3
            y: 0
          - x: 0
            y: 1
          - x: 1
            y: 1
          - x: 2
            y: 1
          - x: 3
            y: 1
          - x: 0
            y: 2
          - x: 2
            y: 2
          - x: 3
            y: 2
          - x: 0
            y: 3
          - x: 1
            y: 3
          - x: 2
            y: 3
          - x: 3
            y: 3
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack model
        run: |
          mkdir -p project logs
          cat payload.part00 payload.part01 payload.part02 > render_payload.zip
          sha256sum -c payload.sha256
          unzip -q render_payload.zip -d project
          test -f project/21_build_render.py
          python patches/fix_blender5_glare.py project/21_build_render.py
          python patches/p22_contrast_candidate.py project/21_build_render.py
      - name: Cache verified Blender release
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender-5.0.1-linux-x64
          key: blender-official-5.0.1-linux-x64-v1
      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          if [[ ! -x blender-5.0.1-linux-x64/blender ]]; then
            archive=blender-5.0.1-linux-x64.tar.xz
            base=https://download.blender.org/release/Blender5.0
            curl -fL --retry 3 --retry-all-errors --connect-timeout 30 "$base/blender-5.0.1.sha256" -o checksums
            grep -F "$archive" checksums > blender.sha256
            curl -fL --retry 3 --retry-all-errors --connect-timeout 30 "$base/$archive" -o "$archive" || curl -fL --retry 3 --retry-all-errors --connect-timeout 30 "https://ftp.halifax.rwth-aachen.de/blender/release/Blender5.0/$archive" -o "$archive"
            sha256sum -c blender.sha256
            tar -xf "$archive"
          fi
          ./blender-5.0.1-linux-x64/blender --version | tee "$GITHUB_WORKSPACE/logs/install.txt"
          echo "$RUNNER_TEMP/blender-5.0.1-linux-x64" >> "$GITHUB_PATH"
      - name: Render native tile
        shell: bash
        env:
          TILE_X: ${{ matrix.x }}
          TILE_Y: ${{ matrix.y }}
        run: |
          set -euo pipefail
          blender -b --python-exit-code 1 --python project/21_build_render.py -- --quality high --render none 2>&1 | tee logs/build.log
          stdbuf -oL -eL blender -b project/renders/high/P21_cycles.blend --python-exit-code 1 --python tools/p23_render_tile.py -- --x "$TILE_X" --y "$TILE_Y" --frame 150 --samples 1024 --seconds 900 2>&1 | tee logs/tile.log
          python -c "import json,pathlib; p=pathlib.Path('project/tile_output'); q=json.loads(next(p.glob('*.json')).read_text()); assert q['complete'] and q['full_resolution']==[3840,2160]; print(q)"
      - name: Save tile
        uses: actions/upload-artifact@v4
        with:
          name: tile-x${{ matrix.x }}-y${{ matrix.y }}
          path: project/tile_output/
          if-no-files-found: error
          retention-days: 30
      - name: Save tile logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-x${{ matrix.x }}-y${{ matrix.y }}
          path: logs/
          if-no-files-found: warn
          retention-days: 7
  join:
    needs: tile
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack model
        run: |
          mkdir -p project logs
          cat payload.part00 payload.part01 payload.part02 > render_payload.zip
          sha256sum -c payload.sha256
          unzip -q render_payload.zip -d project
          test -f project/21_build_render.py
          python patches/fix_blender5_glare.py project/21_build_render.py
          python patches/p22_contrast_candidate.py project/21_build_render.py
      - name: Cache verified Blender release
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender-5.0.1-linux-x64
          key: blender-official-5.0.1-linux-x64-v1
      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          if [[ ! -x blender-5.0.1-linux-x64/blender ]]; then
            archive=blender-5.0.1-linux-x64.tar.xz
            base=https://download.blender.org/release/Blender5.0
            curl -fL --retry 3 --retry-all-errors --connect-timeout 30 "$base/blender-5.0.1.sha256" -o checksums
            grep -F "$archive" checksums > blender.sha256
            curl -fL --retry 3 --retry-all-errors --connect-timeout 30 "$base/$archive" -o "$archive" || curl -fL --retry 3 --retry-all-errors --connect-timeout 30 "https://ftp.halifax.rwth-aachen.de/blender/release/Blender5.0/$archive" -o "$archive"
            sha256sum -c blender.sha256
            tar -xf "$archive"
          fi
          ./blender-5.0.1-linux-x64/blender --version | tee "$GITHUB_WORKSPACE/logs/install.txt"
          echo "$RUNNER_TEMP/blender-5.0.1-linux-x64" >> "$GITHUB_PATH"
      - name: Download remaining tiles
        uses: actions/download-artifact@v4
        with:
          pattern: tile-x*-y*
          path: tiles
          merge-multiple: true
      - name: Reuse verified pilot tile
        uses: actions/download-artifact@v4
        with:
          name: P23-native-tile-46119008318
          run-id: 46119008318
          github-token: ${{ github.token }}
          path: pilot
      - name: Assemble and composite full 4K image
        shell: bash
        run: |
          set -euo pipefail
          cp pilot/project/tile_output/frame_0150_x1_y2.* tiles/
          test "$(find tiles -maxdepth 1 -name '*.exr' | wc -l)" -eq 16
          blender -b --python-exit-code 1 --python project/21_build_render.py -- --quality high --render none 2>&1 | tee logs/build.log
          blender -b project/renders/high/P21_cycles.blend --python-exit-code 1 --python tools/p23_join_tiles.py -- --tiles tiles --out final --frame 150 2>&1 | tee logs/join.log
      - name: Save final 4K frame and QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P23-4K-final
          path: |
            final/
            logs/
            project/p22_changes.json
          if-no-files-found: warn
          retention-days: 30
