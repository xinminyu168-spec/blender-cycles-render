name: P23.1 native 4K tile pilot
on:
  push:
    branches: [main]
    paths: ['.github/workflows/p23-tile.yml']
  workflow_dispatch:
    inputs:
      x:
        description: Tile column (0-3)
        type: number
        default: 1
      y:
        description: Tile row from bottom (0-3)
        type: number
        default: 2
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack model
        run: |
          mkdir -p project logs
          cat payload.part00 payload.part01 payload.part02 > render_payload.zip
          sha256sum -c payload.sha256
          unzip -q render_payload.zip -d project
          test -f project/21_build_render.py
          python patches/fix_blender5_glare.py project/21_build_render.py
          python patches/p22_contrast_candidate.py project/21_build_render.py
      - name: Cache verified Blender release
        id: blender-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/blender-5.0.1-linux-x64
          key: blender-official-5.0.1-linux-x64-v1
      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          if [[ ! -x blender-5.0.1-linux-x64/blender ]]; then
            archive=blender-5.0.1-linux-x64.tar.xz
            base=https://download.blender.org/release/Blender5.0
            curl -fL --retry 3 --retry-all-errors --connect-timeout 30 "$base/blender-5.0.1.sha256" -o checksums
            grep -F "$archive" checksums > blender.sha256
            curl -fL --retry 3 --retry-all-errors --connect-timeout 30 "$base/$archive" -o "$archive" || curl -fL --retry 3 --retry-all-errors --connect-timeout 30 "https://ftp.halifax.rwth-aachen.de/blender/release/Blender5.0/$archive" -o "$archive"
            sha256sum -c blender.sha256
            tar -xf "$archive"
          fi
          ./blender-5.0.1-linux-x64/blender --version | tee "$GITHUB_WORKSPACE/logs/install.txt"
          echo "$RUNNER_TEMP/blender-5.0.1-linux-x64" >> "$GITHUB_PATH"
      - name: Build packed P22 scene and render native 4K crop
        shell: bash
        env:
          TILE_X: ${{ inputs.x }}
          TILE_Y: ${{ inputs.y }}
        run: |
          set -euo pipefail
          X="${TILE_X:-1}"; Y="${TILE_Y:-2}"
          blender -b --python-exit-code 1 --python project/21_build_render.py -- --quality high --render none 2>&1 | tee logs/build.log
          stdbuf -oL -eL blender -b project/renders/high/P21_cycles.blend --python-exit-code 1 --python tools/p23_render_tile.py -- --x "$X" --y "$Y" --frame 150 --samples 1024 --seconds 900 2>&1 | tee logs/tile.log
          python -c "import json,pathlib; p=pathlib.Path('project/tile_output'); q=json.loads(next(p.glob('*.json')).read_text()); assert q['complete'] and q['full_resolution']==[3840,2160] and q['maximum_samples']==1024; print(q)"
      - name: Save test image and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P23-native-tile-${{ github.run_id }}
          path: |
            logs/
            project/tile_output/
            project/renders/high/runtime_qa.json
            project/p22_changes.json
          if-no-files-found: warn
          retention-days: 7
