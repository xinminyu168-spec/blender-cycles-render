name: P21 Cycles physical rendering
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Render mode
        type: choice
        options: [smoke, test, range]
        default: smoke
      quality:
        description: Quality (smoke mode forces smoke quality)
        type: choice
        options: [draft, balanced, high]
        default: draft
      start:
        description: First frame
        type: number
        default: 0
      end:
        description: Last frame (maximum 30 frames per run)
        type: number
        default: 29
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Verify and unpack model
        run: |
          mkdir -p project logs
          cat payload.part00 payload.part01 payload.part02 > render_payload.zip
          sha256sum -c payload.sha256
          unzip -q render_payload.zip -d project
          test -f project/21_build_render.py
          python patches/fix_blender5_glare.py project/21_build_render.py
      - name: Install Blender
        run: |
          cd "$RUNNER_TEMP"
          curl -fL --retry 3 https://download.blender.org/release/Blender5.0/blender-5.0.1-linux-x64.tar.xz -o blender-5.0.1-linux-x64.tar.xz
          curl -fL --retry 3 https://download.blender.org/release/Blender5.0/blender-5.0.1.sha256 -o checksums
          grep -F blender-5.0.1-linux-x64.tar.xz checksums > blender.sha256
          sha256sum -c blender.sha256
          tar -xf blender-5.0.1-linux-x64.tar.xz
          echo "$RUNNER_TEMP/blender-5.0.1-linux-x64" >> "$GITHUB_PATH"
      - name: Render with Cycles
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          QUALITY: ${{ inputs.quality }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == smoke ]]; then QUALITY=smoke; fi
          if [[ "$MODE" == range ]]; then
            [[ "$START" =~ ^[0-9]+$ && "$END" =~ ^[0-9]+$ ]]
            (( 10#$START <= 10#$END && 10#$END <= 299 && 10#$END - 10#$START < 30 ))
          fi
          blender --version | tee logs/blender-version.txt
          blender -b --python-exit-code 1 --python project/21_build_render.py -- --quality "$QUALITY" --render "$MODE" --start "$START" --end "$END" 2>&1 | tee logs/cycles.log
          python - "$MODE" "$QUALITY" "$START" "$END" <<'PY'
          import json, pathlib, sys, struct
          mode,quality,start,end=sys.argv[1:]
          p=pathlib.Path('project/renders')/quality
          qa=json.loads((p/'runtime_qa.json').read_text())
          assert qa['complete'] and qa['engine']=='CYCLES'
          expected=[150] if mode=='smoke' else [0,150,300] if mode=='test' else list(range(int(start),int(end)+1))
          assert [i['frame'] for i in qa['rendered_frames']]==expected
          for i in qa['rendered_frames']:
              with (p/i['file']).open('rb') as f:
                  h=f.read(24)
              assert h[:8]==b'\x89PNG\r\n\x1a\n' and list(struct.unpack('>II',h[16:24]))==qa['resolution']
          print('Verified frames:',expected)
          PY
      - name: Save test image and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P21-cycles-${{ github.run_id }}
          path: |
            logs/
            project/renders/
          if-no-files-found: warn
          retention-days: 7
