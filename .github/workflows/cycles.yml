name: P21 Cycles physical rendering
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'smoke = one test frame; test = three keyframes; range = selected frames'
        type: choice
        options: [smoke, test, range]
        default: smoke
      quality:
        description: 'smoke mode forces 640x360; other modes use this setting'
        type: choice
        options: [draft, balanced, high]
        default: draft
      start:
        description: 'Range first frame (0-299)'
        type: number
        default: 0
      end:
        description: 'Range last frame (max 30 per run)'
        type: number
        default: 29
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p logs project
          cat payload.part00 payload.part01 payload.part02 > render_payload.zip
          sha256sum -c payload.sha256
          unzip -q render_payload.zip -d project
      - name: Install Blender 5.0.1 from official release
        shell: bash
        run: |
          set -euo pipefail
          base=https://download.blender.org/release/Blender5.0
          archive=blender-5.0.1-linux-x64.tar.xz
          curl -fL --retry 3 "$base/$archive" -o "$RUNNER_TEMP/$archive"
          curl -fL --retry 3 "$base/blender-5.0.1.sha256" -o "$RUNNER_TEMP/checksums"
          cd "$RUNNER_TEMP"
          grep -F "$archive" checksums > blender.sha256
          sha256sum -c blender.sha256
          tar -xf "$archive"
          echo "$RUNNER_TEMP/blender-5.0.1-linux-x64" >> "$GITHUB_PATH"
      - name: Run actual Cycles rendering
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          QUALITY: ${{ inputs.quality }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          set -euo pipefail
          if [[ "$MODE" == smoke ]]; then QUALITY=smoke; fi
          if [[ "$MODE" == range ]]; then
            [[ "$START" =~ ^[0-9]+$ && "$END" =~ ^[0-9]+$ ]]
            (( 10#$START <= 10#$END && 10#$END <= 299 && 10#$END - 10#$START < 30 ))
          fi
          blender --version | tee logs/blender-version.txt
          blender -b --python-exit-code 1 --python project/21_build_render.py -- --quality "$QUALITY" --render "$MODE" --start "$START" --end "$END" 2>&1 | tee logs/cycles.log
          python - "$MODE" "$QUALITY" "$START" "$END" <<'PY'
          import json, pathlib, sys, struct
          mode,quality,start,end=sys.argv[1:]
          p=pathlib.Path('project/renders')/quality
          qa=json.loads((p/'runtime_qa.json').read_text())
          assert qa['complete'] and qa['engine']=='CYCLES'
          expected=[150] if mode=='smoke' else [0,150,300] if mode=='test' else list(range(int(start),int(end)+1))
          assert [i['frame'] for i in qa['rendered_frames']]==expected
          for i in qa['rendered_frames']:
              with (p/i['file']).open('rb') as f:
                  h=f.read(24)
              assert h[:8]==b'\x89PNG\r\n\x1a\n' and list(struct.unpack('>II',h[16:24]))==qa['resolution']
          print('Actual Cycles PNG output headers verified:',expected)
          PY
      - name: Upload render outputs and logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P21-cycles-${{ github.run_id }}
          path: |
            logs/
            project/renders/
          if-no-files-found: warn
          retention-days: 7
